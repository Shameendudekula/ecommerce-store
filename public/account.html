<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My account – Mini Store</title>
    <meta name="description" content="Your profile and order history.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%234f46e5'/><text x='50' y='68' font-family='Arial' font-size='58' font-weight='bold' fill='white' text-anchor='middle'>M</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/styles.css">
  </head>
  <body>
    <header class="topbar" id="topbar"></header>

    <main class="container">
      <div class="page-header"><h1>My account</h1></div>
      <div class="two-col">
        <section class="panel" aria-labelledby="orders-title">
          <div class="panel-header"><h2 id="orders-title">Order history</h2></div>
          <div id="orders"></div>
        </section>
        <aside class="panel" aria-labelledby="profile-title">
          <div class="panel-header"><h2 id="profile-title">Profile</h2></div>
          <div id="profile"></div>
        </aside>
      </div>

    </main>

    <footer class="footer muted">Mini Store · a demo shop built with Node.js, Express &amp; MongoDB · No real payments are taken</footer>

    <script src="/js/api.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/cart-store.js"></script>
    <script src="/js/account.js"></script>
  </body>
</html>
